services:
  - type: web
    name: bizflow-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bizflow-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: bizflow-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: bizflow-db
          property: password
      - key: DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: bizflow-db
    databaseName: bizflow
    user: bizflow
    plan: free
