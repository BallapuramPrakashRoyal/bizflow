spring.application.name=bizflow-backend

server.address=0.0.0.0
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/bizflow;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.password=${DB_PASSWORD}

# Required in every environment. Use a unique random value of at least 32 characters.
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
