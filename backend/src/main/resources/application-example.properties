spring.application.name=bizflow-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bizflow}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.password=${DB_PASSWORD}

# Required for public deployments. Generate a unique random value of at least 32 characters.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-before-deployment}
# Comma-separated browser origins, for example:
# https://bizflow.example.com,https://www.bizflow.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
